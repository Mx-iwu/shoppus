name: Build and deploy SHOPPUS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repository
      - uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 3️⃣ Install dependencies (npm install allows no lockfile)
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build the Vite React app
      - name: Build app
        run: npm run build

      # 5️⃣ Deploy only the dist/ folder to Azure App Service
      - name: Deploy dist folder to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: shoppus-web
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_2DFEA089BE82412192D13664B67D11F1 }}
          package: dist
